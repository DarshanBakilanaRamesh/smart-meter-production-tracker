stages:
  - build
  - test

build_application:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:8.0

  script:
    - dotnet restore api/ProductionTracker.csproj
    - dotnet build api/ProductionTracker.csproj --configuration Release --no-restore

unit_tests:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:8.0

  script:
    - dotnet restore tests/ProductionTracker.Tests.csproj
    - dotnet test tests/ProductionTracker.Tests.csproj --configuration Release --no-restore