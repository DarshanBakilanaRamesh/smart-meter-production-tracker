stages:
  - build
  - test
  - package

build_application:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - dotnet restore api/ProductionTracker.csproj
    - dotnet build api/ProductionTracker.csproj --configuration Release --no-restore

unit_tests:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - dotnet restore tests/ProductionTracker.Tests.csproj
    - dotnet test tests/ProductionTracker.Tests.csproj --configuration Release --no-restore

publish_docker_image:
  stage: package
  image: docker:24.0.5-cli

  services:
    - name: docker:24.0.5-dind
      alias: docker

  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"

  script:
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" ./api
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'